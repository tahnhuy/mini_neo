# Hạ tầng NEO Mini: PostgreSQL và NATS (docs/tech-stack.md, mục 3 và 5).
# Mọi cổng chỉ mở trên 127.0.0.1. Mật khẩu đọc từ .env ở gốc repo:
#   docker compose --env-file .env -f deploy/compose.yaml up -d
name: mini-neo

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
      MINI_OWNER_PASSWORD: ${MINI_OWNER_PASSWORD:?đặt MINI_OWNER_PASSWORD trong .env}
      MINI_APP_PASSWORD: ${MINI_APP_PASSWORD:?đặt MINI_APP_PASSWORD trong .env}
      MINI_RELAY_PASSWORD: ${MINI_RELAY_PASSWORD:?đặt MINI_RELAY_PASSWORD trong .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Image postgres 18 đặt dữ liệu dưới /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
      # Chỉ chạy một lần, khi volume còn trống.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.15.1-alpine3.22
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # NATS riêng cho test tích hợp (Q36), để sự kiện của test không chạm dữ liệu demo.
  # Không lưu xuống đĩa: mỗi lần chạy test là một máy chủ sạch.
  nats-test:
    image: nats:2.15.1-alpine3.22
    command: ["-js", "-m", "8222"]
    profiles: ["test"]
    ports:
      - "127.0.0.1:4223:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  natsdata:
